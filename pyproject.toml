[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eia-delivery-twin"
version = "0.1.0"
description = "Reproducible multistate analysis of EIA-860/860M clean-infrastructure delivery"
requires-python = ">=3.11"
dependencies = [
  "catboost",
  "joblib",
  "lightgbm",
  "numpy",
  "pandas",
  "pyarrow",
  "scikit-learn",
  "scipy",
  "statsmodels",
  "tabm",
  "torch",
  "xgboost",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
